function rResults(){const t=total(),lv=level(t);const R=80,C=90,circ=+(2*Math.PI*R).toFixed(2);const rows=DOMAINS.map(d=>({...d,sc:dScore(d),pct:(dScore(d)/6)*100}));return`<div class="page" id="pR">

function goTo(next,dir){const app=document.getElementById('app');const curr=app.querySelector('.page.active');const tmp=document.createElement('div');tmp.innerHTML=next===0?rIntro():(next<=12?rQ(next):rResults());const np=tmp.firstElementChild;app.appendChild(np);curr.classList.add('fade-out');curr.classList.remove('active');requestAnimationFrame(()=>{requestAnimationFrame(()=>{np.classList.add('active');attachSliderDrag();if(next===13)setTimeout(animRes,220);setTimeout(()=>curr.remove(),220);});});STATE.page=next;}
function tapSl(qId,val){updateSl(qId,val);if(navigator.vibrate)navigator.vibrate(6);const dots=document.querySelectorAll(`#csl${qId} .csl-dot`);const q=findQ(qId);const stepIdx=val-q.min;if(dots[stepIdx]&&Math.random()<0.35){const r=dots[stepIdx].getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2);}}
function updateFill(qId){const q=findQ(qId);if(!q)return;const val=STATE.answers[qId]??q.min;const track=document.getElementById('csl'+qId);const fill=document.getElementById('cslf'+qId);if(!track||!fill)return;const dots=track.querySelectorAll('.csl-dot');if(!dots.length)return;const first=dots[0].getBoundingClientRect();const selected=dots[val-q.min];if(!selected)return;const sel=selected.getBoundingClientRect();const trackRect=track.getBoundingClientRect();const startX=first.left+first.width/2-trackRect.left;const endX=sel.left+sel.width/2-trackRect.left;fill.style.left=startX+'px';fill.style.width=Math.max(0,endX-startX)+'px';}
function updateSl(qId,val){const q=findQ(qId);if(!q)return;val=Math.max(q.min,Math.min(q.max,val));STATE.answers[qId]=val;const track=document.getElementById('csl'+qId);if(track){track.querySelectorAll('.csl-dot').forEach(dot=>{const dv=+dot.dataset.val;dot.classList.toggle('active',dv===val);});updateFill(qId);}
const labRow=document.getElementById('csll'+qId);if(labRow){labRow.querySelectorAll('span').forEach((sp,i)=>{sp.classList.toggle('active',(q.min+i)===val);});}}
function slValFromX(track,x,q){const dots=track.querySelectorAll('.csl-dot');if(!dots.length)return q.min;let best=q.min,bestDist=Infinity;dots.forEach(dot=>{const r=dot.getBoundingClientRect();const cx=r.left+r.width/2;const dist=Math.abs(x-cx);if(dist<bestDist){bestDist=dist;best=+dot.dataset.val;}});return best;}
function attachSliderDrag(){document.querySelectorAll('.csl').forEach(track=>{if(track._dragBound)return;track._dragBound=true;const qId=+track.dataset.qid;const q=findQ(qId);requestAnimationFrame(()=>updateFill(qId));let dragging=false;function onStart(e){dragging=true;const cx=e.touches?e.touches[0].clientX:e.clientX;updateSl(qId,slValFromX(track,cx,q));}
function onMove(e){if(!dragging)return;e.preventDefault();const cx=e.touches?e.touches[0].clientX:e.clientX;updateSl(qId,slValFromX(track,cx,q));}
function onEnd(){dragging=false;}
track.addEventListener('touchstart',onStart,{passive:true});track.addEventListener('touchmove',onMove,{passive:false});track.addEventListener('touchend',onEnd);track.addEventListener('mousedown',onStart);window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onEnd);});}
function animRes(){const t=total(),lv=level(t);const circ=2*Math.PI*80;const arc=document.getElementById('garc');if(arc){arc.style.transition='stroke-dashoffset 1.45s cubic-bezier(.4,0,.2,1)';arc.style.strokeDashoffset=String(circ*(1-t/36));}
